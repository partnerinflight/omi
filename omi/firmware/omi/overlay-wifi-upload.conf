# Local-only recorder + Wi-Fi upload to a local receiver (omi-local serve).
# Build:  west build -b omi/nrf5340/cpuapp omi/firmware/omi --sysbuild \
#           -- -DBOARD_ROOT=<repo>/omi/firmware -DCONF_FILE=omi.conf \
#              -DEXTRA_CONF_FILE=overlay-wifi-upload.conf -DSB_EXTRA_CONF_FILE=sysbuild-wifi.conf
# (sysbuild-wifi.conf is required: NCS sysbuild forces CONFIG_WIFI_NRF70=n otherwise.)
CONFIG_OMI_WIFI_UPLOAD=y

# nRF7002 driver (system/STA mode) + WPA2-PSK supplicant
CONFIG_WIFI=y
CONFIG_WIFI_NRF70=y
CONFIG_NRF70_SYSTEM_MODE=y
CONFIG_NRF_WIFI_LOW_POWER=y
CONFIG_NRF70_RX_NUM_BUFS=8
CONFIG_WIFI_NM_WPA_SUPPLICANT=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_WPA3=n
CONFIG_WIFI_NM_WPA_SUPPLICANT_ADVANCED_FEATURES=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_ROBUST_AV=n
CONFIG_WIFI_NM_WPA_SUPPLICANT_WNM=n
CONFIG_WIFI_NM_WPA_SUPPLICANT_RRM=n

# IPv4 + DHCP + TCP sockets, minimal buffering (one connection at a time)
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_PKT_RX_COUNT=6
CONFIG_NET_PKT_TX_COUNT=6
CONFIG_NET_BUF_RX_COUNT=6
CONFIG_NET_BUF_TX_COUNT=12
CONFIG_NET_TC_TX_COUNT=1
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=1
CONFIG_NET_MAX_CONTEXTS=6
CONFIG_NET_CONTEXT_SYNC_RECV=y
# Supplicant select() watches control/event sockets in addition to traffic.
CONFIG_NET_SOCKETS_POLL_MAX=16
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
# Supplicant interface setup runs on this thread; 4200 overflowed on CV1.
CONFIG_NET_MGMT_EVENT_STACK_SIZE=8192
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_NET_CONFIG_SETTINGS=n

# The nRF70 driver + supplicant allocate from the system heap at runtime.
# Nordic's default ask is 150000; 120000 is what fits next to the recorder.
# `omi-local wifi-status` reports free/max-used heap for tuning on hardware.
CONFIG_HEAP_MEM_POOL_SIZE=120000
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# On-demand SoftAP, Nordic provisioning protobuf + credential storage.
CONFIG_NRF_WIFI_IF_AUTO_START=n
CONFIG_NRF70_AP_MODE=y
CONFIG_WIFI_NM_WPA_SUPPLICANT_AP=y
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_BACKEND_SETTINGS=y
CONFIG_NANOPB=y
CONFIG_SMF=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_HTTP_PARSER=y
CONFIG_HTTP_PARSER_URL=y
CONFIG_TLS_CREDENTIALS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_SOFTAP_WIFI_PROVISION=y
CONFIG_SOFTAP_WIFI_PROVISION_SERVER_CERTIFICATE_REGISTER=n
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_DNS_RESOLVER=y
CONFIG_MDNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=n
CONFIG_NET_SOCKETS_DNS_TIMEOUT=5000

# Preserve the 498-byte BLE MTU used by OTA/control, with fewer queued packets.
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_BUF_ACL_TX_COUNT=4
CONFIG_BT_L2CAP_TX_BUF_COUNT=4
CONFIG_BT_ATT_TX_COUNT=4

CONFIG_NET_SOCKETS_CONNECT_TIMEOUT=10000
CONFIG_NET_MAX_CONN=8

CONFIG_BT_DIS_FW_REV_STR="3.0.22-localwifi.14"


# Per-device local MAC for CV1 nRF7002 units with unprogrammed OTP.
CONFIG_HWINFO=y

# Leave transmit-pool space for packets while TCP retains unacknowledged data.
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=2048
# NCS TCP budgets three copies (queued, transmitted, headers/retransmission).
CONFIG_NET_PKT_BUF_TX_DATA_POOL_SIZE=8192
