[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "omi-local"
version = "0.1.0"
description = "Local-only BLE dump tool for the Omi CV1 local-only recorder firmware (no cloud, no app)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["bleak>=0.21"]

[project.scripts]
omi-local = "omi_local.cli:main"

[tool.setuptools.packages.find]
include = ["omi_local*"]
