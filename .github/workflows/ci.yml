name: Local pipeline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python scripts/test.py
      - name: Selfhost compose keeps its hardening
        env:
          HA_COMPOSE_PROJECT_NAME: ci
          DOMAINNAME_CLOUD_SERVER: example.com
          SECONDBRAIN_SERVER_COMMIT: "0000000"
          SECONDBRAIN_DB_PASSWORD: ci-not-a-secret
        run: |
          docker compose -f deploy/selfhost/ci-stub.yml -f deploy/selfhost/secondbrain.yml --profile apps \
            config --format json | python3 deploy/selfhost/check_compose.py
      - name: Hermes checklist contracts (no live Telegram traffic)
        working-directory: integrations/hermes/plugins/secondbrain-checklist
        run: |
          python -m pip install python-telegram-bot==22.5
          python -m unittest discover -s tests -t .
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: choco install ffmpeg -y --no-progress
      - name: Windows pipeline and lock regression tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "${{ github.workspace }}\src;${{ github.workspace }}\omi\firmware\scripts\omi-local"
          python -m unittest discover -s tests -t .
      - name: Setup script boundary tests
        run: ./windows/test-setup.ps1
      - name: Build service, tray, and Python packages
        run: ./windows/build.ps1
      - name: Installed packages outside the source checkout
        run: python scripts/test-installed.py dist/windows/python
      - name: Real SCM service smoke test (synthetic ASR fixture)
        run: ./windows/smoke-test.ps1
      - name: Build pinned MOSS runtime on Windows
        run: ./windows/build-moss.ps1 -EngineRoot "$env:RUNNER_TEMP/second-brain-engines"
      - name: Stage the installer payload (slim)
        shell: pwsh
        run: ./installer/build-installer.ps1 -Slim -Version ci -CacheDir "$env:RUNNER_TEMP/sb-build-cache"
      - name: Payload runs outside the checkout
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $payload = "${{ github.workspace }}/dist/installer/payload"
          & "$payload/app/python/python.exe" -I -m second_brain.cli --help
          if ($LASTEXITCODE -ne 0) { throw 'payload Python cannot start the service CLI' }
          $decoders = & "$payload/engines/ffmpeg/bin/ffmpeg.exe" -hide_banner -decoders
          if (-not ($decoders | Select-String ' opus ')) { throw 'payload ffmpeg has no Opus decoder' }
          Get-Content "$payload/release-manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: second-brain-windows-x64
          path: dist/windows
