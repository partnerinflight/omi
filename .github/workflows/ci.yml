name: Local pipeline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python scripts/test.py
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: choco install ffmpeg -y --no-progress
      - name: Build service, tray, and Python packages
        run: ./windows/build.ps1
      - name: Real SCM service smoke test (synthetic ASR fixture)
        run: ./windows/smoke-test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: second-brain-windows-x64
          path: dist/windows
