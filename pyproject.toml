[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "second-brain-local"
version = "0.2.1"
description = "Omi ingestion, adaptive diarized transcription, and Obsidian delivery"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = ["omi-local==0.2.0"]

[project.scripts]
second-brain = "second_brain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
