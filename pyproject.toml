[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "second-brain-local"
version = "0.1.0"
description = "Omi ingestion, adaptive diarized transcription, and Obsidian delivery"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = []

[project.scripts]
second-brain = "second_brain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
